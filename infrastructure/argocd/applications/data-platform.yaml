apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: financial-data-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ErnestF3700/financial-data-platform
    targetRevision: main
    path: infrastructure

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true